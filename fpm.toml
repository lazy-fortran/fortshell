name = "fortshell"
version = "0.1.0"
license = "MIT"
author = "Christopher Albert"
[build]
auto-tests = true
auto-executables = false
[dependencies]
fortweb = { git = "https://github.com/lazy-fortran/fortweb.git", rev = "bac908389538c598482c184e5b6c9ad1d3c4ea72" }
fortink = { git = "https://github.com/lazy-fortran/fortink.git", rev = "1a61e4ddd9835355f51c47db69642a7145be4f83" }
[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[[executable]]
name = "fortshell"
source-dir = "app"
main = "fortshell.f90"
