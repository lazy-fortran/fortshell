server {
    listen 80;
    listen [::]:80;
    server_name ink.sloppy.at;

    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ink.sloppy.at;

    root /srv/fortshell/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/ink.sloppy.at/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ink.sloppy.at/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' blob:" always;

    gzip on;
    gzip_types application/wasm application/javascript text/javascript application/json text/css;
    expires -1;

    location ~ \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ =404; }
}
