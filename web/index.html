<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eef1f2">
  <title>FortShell notebook</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="fortui.css">
  <link rel="stylesheet" href="shell.css">
</head>
<body>
  <header><div id="controls" aria-label="Notebook controls"></div>
    <div class="secondary">
      <input id="title" aria-label="Notebook title" value="Untitled notebook" maxlength="160">
      <span id="save-status" role="status">Opening notebook...</span>
      <button id="zoom-out" aria-label="Zoom out">−</button><button id="zoom-reset">Fit</button>
      <button id="zoom-in" aria-label="Zoom in">+</button>
      <button id="clear-page" type="button">Clear page</button>
      <button id="compare-toggle" aria-expanded="false">Compare</button>
    </div>
  </header>
  <main id="workspace" tabindex="-1" aria-label="Notebook canvas">
    <div id="paper" aria-label="Page 1">
      <canvas id="background" aria-hidden="true"></canvas>
      <canvas id="committed" aria-hidden="true"></canvas>
      <canvas id="active" aria-label="Draw on this page"></canvas>
      <canvas id="prediction" aria-hidden="true"></canvas>
    </div>
  </main>
  <section id="compare" hidden aria-label="Ink comparison">
    <label>Processing <select id="engine"><option value="wasm">Fortran / WebAssembly</option>
      <option value="js">JavaScript (same model)</option><option value="raw">Raw input</option>
      <option value="perfect">Perfect Freehand</option></select></label>
    <label>Rendering <select id="renderer"><option value="canvas">Canvas 2D</option>
      <option value="webgl">WebGL2</option><option value="webgpu">WebGPU</option></select></label>
    <label>Drawing <select id="scheduling"><option value="immediate">Immediate submission</option>
      <option value="frame">Next animation frame</option></select></label>
    <button id="benchmark">Run comparison</button><button id="results-download" disabled>Results</button>
    <output id="metrics">Measurements run locally. Physical Pencil latency needs a device test.</output>
    <button id="latency-toggle">Record drawing latency</button>
    <button id="latency-results" disabled>Drawing timings</button>
    <output id="latency-status">Record actual drawing to compare input processing, scheduling and submission.</output>
  </section>
  <form id="prompt" hidden><input id="prompt-text" aria-label="Command" autocomplete="off"
    placeholder="Command"><button>Run</button><button id="prompt-close" type="button">Close</button></form>
  <input id="file" type="file" accept=".pdf,.fortshell,application/pdf,application/json" hidden>
  <div id="error" role="alert" hidden></div>
  <script src="main.js"></script><script type="module" src="shell.js"></script>
</body>
</html>
